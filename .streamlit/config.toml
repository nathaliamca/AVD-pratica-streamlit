# Summer Sunset: coral, pêssego, dourado e roxo.
[theme]
base = "light"
font = "sans serif"
headingFont = "sans serif"
primaryColor = "#C74736"
backgroundColor = "#FFF8F2"
secondaryBackgroundColor = "#FFEEE5"
textColor = "#39263F"
borderColor = "#D8B9B3"
chartCategoricalColors = ["#6A3D78", "#ED6A5A", "#F6B65B", "#BC5D85", "#985E49", "#9C659C", "#C74736"]
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "1rem"